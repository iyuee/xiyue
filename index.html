<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>岁月留白 Daily Saying</title>
    <style>
        /* 基础样式：黑底、全屏 */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #0d0d0d;
            overflow: hidden; /* 防止出现滚动条 */
            font-family: 'Times New Roman', 'Source Han Serif CN', 'Songti TC', serif; /* 使用优雅的衬线体 */
            color: #ffffff;
        }

        /* 极简网格背景 */
        .background-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
        }

        /* 整个页面的主布局容器：左右结构 */
        .main-container {
            display: flex;
            height: 100vh;
            align-items: center; /* 垂直居中 */
            padding: 0 10%; /* 左右留白 */
            box-sizing: border-box;
        }

        /* 左侧文字区域 */
        .text-section {
            flex: 1; /* 占据剩余空间 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start; /* 文字左对齐 */
            padding-right: 5%;
        }

        /* 右侧图片区域 */
        .image-section {
            flex: 1;
            display: flex;
            justify-content: flex-end; /* 图片右对齐 */
            align-items: center;
        }

        /* 顶部标题：“岁月留白” */
        .top-title {
            position: absolute;
            top: 50px;
            left: 10%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .title-main {
            font-size: 24px;
            font-weight: normal;
            margin-bottom: 5px;
            color: rgba(255, 255, 255, 0.9);
        }

        .title-sub {
            font-size: 12px;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
        }

        /* 右上角时间戳 */
        .top-timestamp {
            position: absolute;
            top: 50px;
            right: 10%;
            font-size: 12px;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.6);
            font-family: 'Courier New', Courier, monospace; /* 使用等宽字体更有科技感 */
        }

        /* 左侧诗句内容 */
        .poem-content {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            max-width: 80%; /* 限制宽度以保持整齐 */
        }

        .quote-icon {
            font-size: 64px;
            color: rgba(255, 255, 255, 0.1);
            margin-left: -20px; /* 轻微负向偏置，更有设计感 */
            margin-bottom: -10px;
        }

        .poem-text {
            font-size: 20px;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 1px;
            margin-bottom: 30px;
        }

        .attribution {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            align-self: flex-end; /* 作者名字靠右 */
        }

        /* 右侧图片样式：关键在于这个优雅的“相框”处理 */
        .portrait-image {
            max-width: 80%; /* 限制图片最大宽度 */
            max-height: 80vh; /* 限制图片最大高度 */
            width: auto;
            height: auto;
            border-radius: 4px; /* 极轻微的圆角 */
            box-shadow: 
                0 0 0 10px rgba(0, 0, 0, 0.5), /* 内层深色边框 */
                0 10px 30px rgba(0, 0, 0, 0.3); /* 整体阴影，更有立体感 */
            mask-image: linear-gradient(to bottom, transparent 1%, black 20%, black 80%, transparent 99%); /* 关键：顶部和底部羽化消隐 */
            -webkit-mask-image: linear-gradient(to bottom, transparent 1%, black 20%, black 80%, transparent 99%); /* Safari 兼容 */
        }

    </style>
</head>
<body>

    <div class="background-grid"></div>

    <div class="top-title">
        <div class="title-main">岁月留白</div>
        <div class="title-sub">DAILY SAYING</div>
    </div>

    <div class="top-timestamp" id="timestamp">2026-06-12 09:22:11</div>

    <div class="main-container">
        <div class="text-section">
            <div class="poem-content">
                <div class="quote-icon">“</div>
                <div class="poem-text">
                    草在结它的种子，风在摇它的叶子。我们站着不说话，就十分美好。
                </div>
                <div class="attribution">—顾城</div>
            </div>
        </div>

        <div class="image-section">
            <img src="portrait.png" alt="岁月留白人像" class="portrait-image">
        </div>
    </div>

    <script>
        function updateTimestamp() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const timestampStr = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
            document.getElementById('timestamp').textContent = timestampStr;
        }

        // 初始运行一次
        updateTimestamp();
        // 然后每秒运行一次
