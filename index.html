<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日一言</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;}
        body {
            min-height:100vh;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            /* 同款浅绿渐变背景 */
            background: linear-gradient(135deg, #f0f9f0, #e8f5e9);
            color:#333;
            font-family:"Microsoft Yahei",sans-serif;
            padding:20px;
        }
        .box {
            max-width:600px;
            width: 100%;
            text-align:center;
            background:#fff;
            padding:40px 30px;
            border-radius:16px;
            box-shadow:0 4px 20px rgba(0,0,0,0.08);
            animation: fadeIn 0.8s ease;
        }
        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(20px);}
            to {opacity: 1; transform: translateY(0);}
        }
        h1 {font-size:22px;margin-bottom:30px;color:#4CAF50;}
        .sentence {font-size:18px;line-height:2;margin-bottom:25px;}
        .author {font-size:14px;color:#888;}
        .refresh {
            margin-top:30px;
            padding:10px 26px;
            border:none;
            background:#4CAF50;
            color:#fff;
            border-radius:30px;
            cursor:pointer;
            font-size:15px;
            transition: all 0.3s ease;
        }
        .refresh:hover {
            background:#3d8b40;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3);
        }
        /* 实时时钟样式 */
        .clock {
            margin: 20px 0;
            font-size: 1.2rem;
            color: #4CAF50;
        }
        /* 访客计数 */
        .counter {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #999;
        }
        /* 底部署名 */
        .signature {
            margin-top: 40px;
            font-size: 0.9rem;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>每日一言</h1>
        <div class="sentence" id="text"></div>
        <div class="author" id="author"></div>
        <button class="refresh" onclick="getSentence()">换一句</button>

        <!-- 实时时钟 -->
        <div class="clock" id="clock"></div>

        <!-- 访客统计 -->
        <div class="counter">
            今日访问：<span id="today">0</span> | 总访问：<span id="total">0</span>
        </div>
    </div>

    <div class="signature"> — 由你的Hermes Agent小助手制作 ✨</div>

<script>
    // 实时时钟
    function updateClock() {
        const now = new Date();
        const time = now.toLocaleTimeString('zh-CN', { hour12: false });
        const date = now.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
        document.getElementById('clock').textContent = `${date} ${time}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 每日一言语录
    const words = [
        {text:"心怀善意，所遇皆温柔。", author:"佚名"},
        {text:"慢慢来，好戏都在烟火里。", author:"佚名"},
        {text:"保持热爱，奔赴下一场山海。", author:"佚名"},
        {text:"愿日子清透，万事顺心。", author:"佚名"},
        {text:"生活平凡，但也闪闪发光。", author:"佚名"},
        {text:"心有暖阳，何惧人生荒凉。", author:"佚名"},
        {text:"追风赶月莫停留，平芜尽处是春山。", author:"古风"},
        {text:"前路浩浩荡荡，万事尽可期待。", author:"佚名"},
        {text:"把烦恼清空，才能装下快乐。", author:"佚名"},
        {text:"愿你遍历山河，仍觉人间值得。", author:"佚名"}
    ];
    function getSentence(){
        let r = Math.floor(Math.random()*words.length);
        document.getElementById("text").innerText = words[r].text;
        document.getElementById("author").innerText = "—— "+words[r].author;
    }

    // 访客计数
    let total = localStorage.getItem('visit_total') || 0;
    let today = localStorage.getItem('visit_today') || 0;
    let lastDate = localStorage.getItem('visit_date');
    const nowDate = new Date().toDateString();

    if (lastDate !== nowDate) {
        today = 0;
        localStorage.setItem('visit_date', nowDate);
    }

    total++;
    today++;
    localStorage.setItem('visit_total', total);
    localStorage.setItem('visit_today', today);

    document.getElementById('today').textContent = today;
    document.getElementById('total').textContent = total;

    // 页面初始化
    window.onload = getSentence;
</script>
</body>
</html>
