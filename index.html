<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAYING.XIYUE | 每日一言 · 岁月留白</title>
    <style>
        :root {
            --primary-gold: #dfc59e;
            --dark-bg: #0b0c0e;
            --card-bg: rgba(22, 24, 29, 0.6);
            --text-light: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--dark-bg);
            color: var(--text-light);
            font-family: 'Cinzel', 'Noto Serif SC', serif;
            letter-spacing: 2px;
            overflow: hidden;
            height: 100vh;
        }

        /* 隐藏的网格背景，增加细节质感 */
        body::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(223, 197, 158, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(223, 197, 158, 0.03) 1px, transparent 1px);
            background-size: 60px 60px; z-index: -1;
        }

        header {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 90px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 5%; z-index: 1000;
        }

        .logo-area { text-align: left; }
        .logo-title { font-size: 1.5rem; font-weight: 400; letter-spacing: 6px; color: #fff; }
        .logo-sub { font-size: 0.6rem; color: var(--primary-gold); letter-spacing: 4px; text-transform: uppercase; margin-top: 4px; }

        .time-box { font-size: 0.8rem; color: var(--primary-gold); font-family: monospace; }

        /* 主体布局：完美的黄金比例分割 */
        main {
            height: 100vh;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            align-items: center;
            padding: 0 5% 0 8%;
        }

        /* 左侧文字艺术排版 */
        .content-section {
            padding-right: 8%;
        }
        .quote-mark {
            font-size: 4rem;
            color: var(--primary-gold);
            font-family: Georgia, serif;
            line-height: 1;
            opacity: 0.6;
            margin-bottom: 10px;
        }
        .quote-text {
            font-size: 1.8rem;
            line-height: 1.8;
            color: #fff;
            font-weight: 300;
            margin-bottom: 30px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .quote-author {
            font-size: 0.9rem;
            color: var(--primary-gold);
            text-align: right;
            padding-right: 10%;
            text-transform: uppercase;
        }

        /* 右侧意境大图（水墨写意与现代光影融合的优雅女性） */
        .image-section {
            height: 75vh;
            position: relative;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            border: 1px solid rgba(223, 197, 158, 0.1);
        }
        .image-section::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to right, var(--dark-bg) 0%, transparent 15%, transparent 85%, var(--dark-bg) 100%),
                        linear-gradient(to top, rgba(11,12,14,0.5), transparent);
        }
        .hero-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(1.05) brightness(0.9);
        }

        /* 移动端自适应 */
        @media (max-width: 900px) {
            main { grid-template-columns: 1fr; padding: 90px 6% 40px 6%; }
            .image-section { display: none; }
            .quote-text { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-title">岁月留白</div>
            <div class="logo-sub">Daily Saying</div>
        </div>
        <div class="time-box" id="live-time">LOADING...</div>
    </header>

    <main>
        <section class="content-section">
            <div class="quote-mark">“</div>
            <div class="quote-text" id="hitokoto_text">与其匆忙地追赶日落，不如静坐窗前，听一朵花开的声音。</div>
            <div class="quote-author" id="hitokoto_author">— 佚名</div>
        </section>

        <section class="image-section">
            <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=cover&w=800&q=80" alt="Eastern Elegance" class="hero-img">
        </section>
    </main>

    <script>
        // 动态时钟
        function updateTime() {
            const now = new Date();
            document.getElementById('live-time').textContent = now.toISOString().slice(0, 10) + ' ' + now.toLocaleTimeString();
        }
        setInterval(updateTime, 1000);
        updateTime();

        // 随机每日一言库（每次刷新网页随机展示一条，伪装度极高）
        const quotes = [
            { text: "与其匆忙地追赶日落，不如静坐窗前，听一朵花开的声音。", author: "林清玄" },
            { text: "草在结它的种子，风在摇它的叶子。我们站着不说话，就十分美好。", author: "顾城" },
            { text: "答案很长，我准备用一生的时间来回答你，你准备好听了吗？", author: "林徽因" },
            { text: "世界喧嚣，任其嘈杂。内心的波澜不惊，方是最高级的优雅。", author: "岁月留白" },
            { text: "时光悄然流转，愿你在静谧的力量中，活出属于自己的深度。", author: "一言矩阵" }
        ];

        // 随机选择一条注入
        const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
        document.getElementById('hitokoto_text').textContent = randomQuote.text;
        document.getElementById('hitokoto_author').textContent = "— " + randomQuote.author;
    </script>

</body>
</html>
