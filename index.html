<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>岁月留白 Daily Saying</title>
    <style>
        /* 基础样式：黑底、全屏 */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #0b0c0e; /* 换成更有质感的极暗黑 */
            overflow: hidden; /* 防止出现滚动条 */
            font-family: 'Cinzel', 'Times New Roman', 'Source Han Serif CN', 'Songti TC', serif; /* 使用优雅的衬线体 */
            color: #f3f4f6;
            letter-spacing: 1px;
        }

        /* 极简香槟金暗色网格背景 */
        .background-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(223, 197, 158, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(223, 197, 158, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: -1;
        }

        /* 整个页面的主布局容器：左右结构 */
        .main-container {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            height: 100vh;
            align-items: center; /* 垂直居中 */
            padding: 0 8% 0 10%; /* 左右留白 */
            box-sizing: border-box;
        }

        /* 左侧文字区域 */
        .text-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start; /* 文字左对齐 */
            padding-right: 8%;
        }

        /* 右侧图片区域 */
        .image-section {
            height: 75vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            border: 1px solid rgba(223, 197, 158, 0.1);
        }

        .image-section::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to right, #0b0c0e 0%, transparent 15%, transparent 85%, #0b0c0e 100%),
                        linear-gradient(to top, rgba(11,12,14,0.4), transparent);
            pointer-events: none;
        }

        /* 顶部标题：“岁月留白” */
        .top-title {
            position: absolute;
            top: 50px;
            left: 10%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .title-main {
            font-size: 26px;
            font-weight: normal;
            margin-bottom: 5px;
            letter-spacing: 4px;
            color: #ffffff;
        }

        .title-sub {
            font-size: 10px;
            letter-spacing: 4px;
            color: #dfc59e; /* 香槟金次标题 */
            text-transform: uppercase;
        }

        /* 右上角时间戳 */
        .top-timestamp {
            position: absolute;
            top: 54px;
            right: 10%;
            font-size: 12px;
            letter-spacing: 1px;
            color: #dfc59e;
            font-family: 'Courier New', Courier, monospace;
        }

        /* 左侧诗句内容 */
        .poem-content {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 100%;
        }

        .quote-icon {
            font-size: 4.5rem;
            color: #dfc59e;
            font-family: Georgia, serif;
            line-height: 1;
            opacity: 0.5;
            margin-left: -10px;
            margin-bottom: 10px;
        }

        .poem-text {
            font-size: 1.8rem;
            line-height: 1.8;
            color: #ffffff;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .attribution {
            font-size: 14px;
            color: #dfc59e;
            align-self: flex-end; /* 作者名字靠右 */
            padding-right: 10%;
            letter-spacing: 3px;
        }

        /* 右侧图片样式 */
        .portrait-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(1.05) brightness(0.9);
            display: block;
        }

        /* 移动端自适应 */
        @media (max-width: 900px) {
            .main-container { grid-template-columns: 1fr; padding: 90px 6% 40px 6%; }
            .image-section { display: none; }
            .poem-text { font-size: 1.4rem; }
        }

    </style>
</head>
<body>

    <div class="background-grid"></div>

    <div class="top-title">
        <div class="title-main">岁月留白</div>
